name: Journal keep awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Keep the journal service active
        run: curl --fail --silent --show-error --max-time 90 --retry 1 --retry-delay 5 https://journal-site-yfev.onrender.com/api/groups > /dev/null
