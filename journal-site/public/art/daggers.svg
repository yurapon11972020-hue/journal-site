<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Скрещённые кинжалы">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6d717c"/>
      <stop offset="30%"  stop-color="#eef0f5"/>
      <stop offset="48%"  stop-color="#ffffff"/>
      <stop offset="62%"  stop-color="#9aa0ac"/>
      <stop offset="100%" stop-color="#53565f"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2a2c33"/>
      <stop offset="45%"  stop-color="#8c9099"/>
      <stop offset="100%" stop-color="#1d1f24"/>
    </linearGradient>
    <radialGradient id="fire" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0%"   stop-color="#ffd479" stop-opacity="0.95"/>
      <stop offset="35%"  stop-color="#f08a24" stop-opacity="0.6"/>
      <stop offset="70%"  stop-color="#8f2b0d" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="night" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0%"   stop-color="#1c1d23"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>

    <g id="dagger">
      <!-- клинок -->
      <path d="M400 60 L444 250 L432 620 L400 660 L368 620 L356 250 Z" fill="url(#steel)"/>
      <path d="M400 78 L400 650" stroke="#ffffff" stroke-width="3" opacity="0.55"/>
      <!-- гарда -->
      <path d="M250 660 L550 660 L520 706 L280 706 Z" fill="url(#steel)"/>
      <path d="M296 706 L504 706 L492 730 L308 730 Z" fill="#4b4e57"/>
      <!-- рукоять -->
      <rect x="372" y="730" width="56" height="180" fill="url(#grip)"/>
      <rect x="372" y="768" width="56" height="8" fill="#0e0f12" opacity="0.8"/>
      <rect x="372" y="822" width="56" height="8" fill="#0e0f12" opacity="0.8"/>
      <circle cx="400" cy="934" r="34" fill="url(#steel)"/>
      <circle cx="400" cy="934" r="14" fill="#15161a"/>
    </g>
  </defs>

  <rect width="1200" height="820" fill="url(#night)"/>
  <ellipse cx="600" cy="470" rx="400" ry="330" fill="url(#fire)" filter="url(#soft)"/>

  <!-- кинжалы вписаны в кадр целиком: обрезка по краям их не заденет -->
  <g transform="translate(600 410) scale(0.74)">
    <g transform="rotate(30) translate(-400 -500)"><use href="#dagger" opacity="0.95"/></g>
    <g transform="rotate(-30) translate(-400 -500)"><use href="#dagger"/></g>
  </g>

  <rect width="1200" height="820" filter="url(#grain2)" opacity="0.9"/>
</svg>
