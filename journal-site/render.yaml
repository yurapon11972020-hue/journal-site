services:
  - type: web
    name: journal-site
    runtime: node
    plan: free
    buildCommand: npm install --package-lock=false --registry=https://registry.npmjs.org/ --no-audit --no-fund && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: JOURNAL_SOURCE
        value: yandex-public-cache
      # Список групп: одна ссылка = одна группа, ссылка на папку = все Excel внутри.
      # Несколько групп пишутся через запятую или с новой строки,
      # можно задать своё название: "ИСиП-25/9 = https://disk.yandex.ru/i/ССЫЛКА".
      - key: YANDEX_DISK_PUBLIC_URLS
        value: https://disk.yandex.ru/i/jr0lr00cUQp0FQ
      - key: JOURNAL_CACHE_INTERVAL_MINUTES
        value: "5"
      - key: JOURNAL_CACHE_MAX_FILES
        value: "2"
      - key: JOURNAL_CACHE_DIR
        value: /tmp/journal-cache
      - key: JOURNAL_REFRESH_FROM_HOUR
        value: "5"
      - key: JOURNAL_REFRESH_TO_HOUR
        value: "24"
      - key: JOURNAL_TIMEZONE_OFFSET_HOURS
        value: "5"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
